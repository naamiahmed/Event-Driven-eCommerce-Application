name: CI Test & Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Syntax Linting
        run: npm run lint

      - name: Run Unit Tests & Coverage
        run: npm run test:coverage

  terraform-validate:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Check Terraform Format
        run: terraform -chdir=infrastructure/terraform fmt -check

      - name: Terraform Init (Dry Run / Validation)
        run: terraform -chdir=infrastructure/terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=infrastructure/terraform validate
